[workspace]
members = ["crates/devlink-cli", "crates/devlink-broker"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
devlink-broker = { path = "crates/devlink-broker" }
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
futures-util = "0.3"
libc = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "rustls-tls-native-roots"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
