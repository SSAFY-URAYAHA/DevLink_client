name: Review 171 packaging

# v* 태그를 push하면 OS별 번들을 만들고 GitHub Release를 생성한다.
# workflow_dispatch는 브랜치에서 실행하면 artifact만 만들고, 태그를 골라 실행하면 Release까지 만든다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 패키징 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # 인자 없이 실행하면 rust-toolchain.toml의 stable을 설치한다. Windows에서는
      # stable-x86_64-pc-windows-msvc가 되며 패키징 스크립트도 이 도구 체인을 쓴다.
      - name: Rust toolchain 설치
        working-directory: rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: release
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json
      # 태그 실행이면 태그와 소스 버전(Cargo.toml·package.json)이 같은지 스크립트가 확인한다.
      # 스크립트는 번들의 devlink --version과 MCP initialize 응답까지 확인한 뒤 압축한다.
      - name: 번들 만들기
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          args=(--out-dir dist)
          if [ "$REF_TYPE" = tag ]; then args+=(--expect-version "$REF_NAME"); fi
          node .github/scripts/package-release.mjs "${args[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: devlink-${{ runner.os }}
          path: |
            dist/devlink-*.zip
            dist/devlink-*.tar.gz
          if-no-files-found: error

  release:
    name: GitHub Release
    needs: package
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: devlink-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS 만들기
        run: node .github/scripts/package-release.mjs --checksums dist
      # 태그에 '-'가 있으면(v0.2.0-rc.1 등) 사전 릴리스로 표시한다.
      - name: Release 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/devlink-* dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "DevLink $TAG" --generate-notes "${flags[@]}"
