name: PR83 MCP verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mcp-server:
    name: MCP 서버 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: packages/mcp-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: packages/mcp-server/package-lock.json
      - name: 의존성 설치
        run: npm ci
      # 빌드, contracts/ 계약 대조, node --test 회귀를 함께 실행한다.
      - name: 빌드·계약 대조·테스트
        if: runner.os != 'Windows'
        run: npm test
      - name: 빌드·계약 대조·테스트 (Windows, 소유자 보정)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ${{ github.workspace }}/.github/scripts/invoke-as-user-owner.ps1 npm test
